# /etc/nginx/sites-available/bloodandsand.cl
# Front (Angular PWA) and API on the same domain: cookies stay first-party and there is no CORS.
server {
    listen 80;
    server_name bloodandsand.cl www.bloodandsand.cl;
    return 301 https://bloodandsand.cl$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bloodandsand.cl;

    ssl_certificate     /etc/letsencrypt/live/bloodandsand.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodandsand.cl/privkey.pem;

    root /var/www/bloodandsand/browser;   # contents of dist/blood-and-sand/browser
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # Hashed bundles: cache forever. index.html and the service worker: never.
    location ~* \.(?:js|css|woff2|webp|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /ngsw-worker.js     { add_header Cache-Control "no-cache"; }
    location = /ngsw.json          { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
